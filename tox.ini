[tox]
distshare = {homedir}/.tox/distshare
envlist =
    lint,
    test
skip_missing_interpreters = true

[testenv]
setenv =
    PYTHONPATH = {toxinidir}:{env:PYTHONPATH:}:.
deps =
    websocket-client
    coverage
    mock
    pytest
    pytest-mock

commands = coverage run --parallel --source ascenderkit -m pytest --doctest-glob='*.md' --junit-xml=report.xml {posargs:tests/unit}

[testenv:lint]
# Formatting and linting both come from ruff. Its configuration lives in
# pyproject.toml under [tool.ruff], and the rule selection there is the one
# ported from the [flake8] block this replaces, all 16 of them. Pinned so
# results do not drift as new releases land.
deps =
    ruff==0.16.6
commands =
    ruff format --check ascenderkit tests setup.py
    ruff check ascenderkit
    - coverage erase

[testenv:coveralls]
commands=
    - coverage combine
    - coverage report -m
    - coveralls

[pytest]
addopts = -v --tb=native
junit_family=xunit2
testpaths = tests/unit
markers =
    integration: needs a running Ascender; selected by pointing CONTROLLER_HOST at one
