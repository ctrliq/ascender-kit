[tox]
distshare = {homedir}/.tox/distshare
envlist =
    lint,
    test
skip_missing_interpreters = true

[testenv]
setenv =
    PYTHONPATH = {toxinidir}:{env:PYTHONPATH:}:.
deps =
    websocket-client
    coverage
    mock
    pytest
    pytest-mock

commands = coverage run --parallel --source ascenderkit -m pytest --doctest-glob='*.md' --junit-xml=report.xml {posargs:tests/unit}

[testenv:lint]
deps =
    {[testenv]deps}
    black==26.5.1
    flake8==7.3.0
commands =
    black --check ascenderkit tests setup.py
    flake8 ascenderkit
    - coverage erase

[testenv:typecheck]
# Advisory: the type checker runs over ascenderkit and reports what it finds
# without failing the merge, so the diagnostics already in the tree can be
# worked through a module at a time. It resolves third-party imports out of the
# environment the package is installed in; set TYPECHECK_PYTHON to point it at
# one. Pinned like the other linters so results do not drift.
deps =
    {[testenv]deps}
    ty==0.0.74
passenv =
    TYPECHECK_PYTHON
commands =
    ty check ascenderkit --python {env:TYPECHECK_PYTHON:{envdir}}

[testenv:coveralls]
commands=
    - coverage combine
    - coverage report -m
    - coveralls

[flake8]
max-line-length = 160
select = F401,F402,F821,F823,F841,F811,E265,E266,F541,W605,E722,F822,F523,W291,F405,F632
exclude = .git,__pycache__,.tox,build,dist,env,venv

[pytest]
addopts = -v --tb=native
junit_family=xunit2
testpaths = tests/unit
markers =
    integration: needs a running Ascender; selected by pointing CONTROLLER_HOST at one
