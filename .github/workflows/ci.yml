---
name: Ascender Kit CI

on:
  push:
    branches:
      - main
      - stable-*
  pull_request:
    branches:
      - main
      - stable-*
  workflow_dispatch:
  # Called by release.yml, so a tag cannot publish anything the checks have not
  # passed on first.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.x"

      - name: Install ruff
        run: pip install ruff==0.16.6

      - name: Check formatting
        run: ruff format --check --diff ascenderkit tests setup.py

      - name: Run the linter
        run: ruff check ascenderkit

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          # The oldest and newest supported interpreters. Version-specific
          # breakage lives at the boundaries: APIs removed at the top of the
          # range, and not yet available at the bottom.
          - "3.11"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # setuptools_scm reads the version from tags, which a shallow
          # checkout does not fetch. It falls back to a 0.1.dev version
          # without them, so the tests would not run against the real one.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install the package and test dependencies
        run: |
          pip install -e ".[websockets,crypto]"
          pip install pytest pytest-mock coverage

      - name: Run tests
        run: coverage run --source ascenderkit -m pytest tests/unit -v

      - name: Report coverage
        run: coverage report -m

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.x"

      - name: Install the package and the type checker
        # ty resolves third-party imports out of the environment the package is
        # installed in, so the extras have to be here too. docs is among them
        # because ascenderkit/cli/sphinx.py imports docutils and autoprogram at
        # module level. formatting is not: jq ships as a compiled extension with
        # no stubs, so installing it resolves nothing.
        run: |
          pip install -e ".[websockets,crypto,docs]"
          pip install ty==0.0.74

      - name: Run the type checker
        run: ty check ascenderkit

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.x"

      - name: Install the package and the docs extra
        run: pip install -e ".[docs]"

      - name: Build the documentation
        # No credentials here, so reference.rst is left out and the six
        # hand-written pages are built. -W turns a dead cross-reference or a
        # malformed directive into a failure. See docs/source/conf.py.
        run: >-
          sphinx-build -b html -W --keep-going
          ascenderkit/cli/docs/source "${RUNNER_TEMP}/html"

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # setuptools_scm derives the version from tags, which a shallow
          # checkout does not fetch.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.x"

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build

      - name: Check the built distribution
        run: twine check dist/*

      - name: Verify the console scripts are installable
        run: |
          pip install dist/*.whl
          ascender --help
